# This project is a single package, not a workspace — siteOps-client and
# siteOps-server are separate repositories that meet over HTTP, and joining
# them under one workspace is exactly what the split was for. The file exists
# because pnpm 11 reads its settings from here rather than from package.json.

# Dependencies permitted to run install scripts. Everything else is blocked, so
# a transitive package cannot execute code during `pnpm install`. These are
# native toolchain packages that legitimately need a postinstall step.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
