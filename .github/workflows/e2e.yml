name: End-to-end

# On demand rather than on every push. The suite needs the API and the database
# from siteOps-server, so it checks out a second private repository — which
# needs a token this workflow cannot assume is configured. Set the repository
# secret SERVER_REPO_TOKEN to a PAT with read access to thesumonart/siteOps-server,
# then run this workflow from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      server-ref:
        description: "Branch or tag of siteOps-server to test against"
        required: false
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  E2E_WEB_PORT: 3100
  E2E_API_URL: http://localhost:4100
  # No replica set in CI; `directConnection` makes the driver skip topology
  # discovery and talk to the standalone.
  E2E_MONGODB_URI: mongodb://localhost:27017/siteops_e2e?directConnection=true
  E2E_AUTH_SECRET: e2e-only-auth-secret-value-not-used-anywhere-else

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - name: Checkout the client
        uses: actions/checkout@v5
        with:
          path: client

      - name: Checkout the server
        uses: actions/checkout@v5
        with:
          repository: thesumonart/siteOps-server
          ref: ${{ inputs.server-ref }}
          token: ${{ secrets.SERVER_REPO_TOKEN }}
          path: server

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: client/.nvmrc
          cache: pnpm

      - name: Install the server
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build the API
        working-directory: server
        run: pnpm --filter @siteops/api... build

      - name: Start the API
        working-directory: server
        run: |
          NODE_ENV=test \
          PORT=4100 \
          APP_URL=http://localhost:3100 \
          API_URL=http://localhost:4100 \
          MONGODB_URI="$E2E_MONGODB_URI" \
          MONGODB_AUTO_INDEX=true \
          AUTH_SECRET="$E2E_AUTH_SECRET" \
          LOG_LEVEL=warn \
          AUTH_RATE_LIMIT_MAX_REQUESTS=1000 \
          RATE_LIMIT_MAX_REQUESTS=5000 \
          node apps/api/dist/main.js &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4100/health > /dev/null && exit 0
            sleep 1
          done
          echo "The API did not become healthy in 60s" >&2
          exit 1

      - name: Install the client
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: client
        run: pnpm test:e2e

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
